      Aye, buen día como estas, puede ser que me dijiste que todo el entrenamiento salía ... Y de ser así, si te transfiero ... me pasas el resto de las unidades?

      La verdad es que están muy buenas y estoy medio complicado con los tiempos me va a venir bien tener todo completo. Si me confirmas eso te transfiero eso ahora. Saludos.
