  - title: Daina
    md: |
      Aye! Perdón la hora! Pero te quería agradecer! Sin tu empujón no hubiera podido!!

      Llegue a hacer casi todo y por lo poco que estudié fue un montón!!

      Hice todo a conciencia y pasó a paso! No creo que esté todo bien, pero por lo menos pude llegar con todo! Así que gracias!!!!
  - title: Estefi
    md: |
      Aye antes que termine el día quiero agradecerte por las palabras de hoy! Me encanta la persona que sos, por eso estás rodeada de cosas buenas.

      Y a veces es bueno que alguien que no es tu psicologa o tu amiga íntima q conoce todo de uno te diga esas cosas.

      Ahora me siento con menos culpa que ayer por las materias. Y gracias por entenderme.

      Cuando resuelva que hago con las benditas matemáticas te llamo para comenzar nuevamente. Te mando un beso enorme!!
  - title: Gastón
